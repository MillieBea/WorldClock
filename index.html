<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>World Clock - Milena Wzietek</title>
  </head>
  <body>
    <div class="container">
      <h1>World Clock</h1>
      <select>
        <option value="">Select a city...</option>
        <option value="">London</option>
        <option value="">Barcelona</option>
        <option value="">Chicago</option>
      </select>
      <div class="city">
        <h2>Madrid 🇪🇸</h2>
        <div class="date">May 26th 2026</div>
        <div class="time">1:45:15 AM</div>
        <h2>Lisbon 🇵🇹</h2>
        <div class="date">May 26th 2026</div>
        <div class="time">1:45:15 AM</div>
        <h2>Tokyo 🇯🇵</h2>
        <div class="date">May 26th 2026</div>
        <div class="time">1:45:15 AM</div>
        <h2>Perth 🇦🇺</h2>
        <div class="date">May 26th 2026</div>
        <div class="time">1:45:15 AM</div>
      </div>
    </div>
    <footer>
      This project was coded with 🩶 by Milena and is
      <a href="https://github.com/MillieBea/WorldClock" target="_blank">
        open-sourced on GitHub</a
      >
    </footer>
    <script src="javascript/index.js"></script>
  </body>
</html>
